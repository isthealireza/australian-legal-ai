repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format-check
        name: Ruff format check
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Mypy strict
        entry: uv run --locked mypy .
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in Git history
        entry: gitleaks git --redact --verbose --log-opts=--all .
        stages: [manual]
        pass_filenames: false
        always_run: true
